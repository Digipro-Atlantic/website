# The build prerenders every page (scripts/prerender.mjs), so Netlify serves
# real HTML per route: /pricing -> dist/pricing/index.html, and anything
# unknown -> dist/404.html with a 404 status (no SPA catch-all redirect).
[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vite fingerprints everything in /assets, so browsers can keep it for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
